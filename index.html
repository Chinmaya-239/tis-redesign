<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tulas International School | CBSE Co-ed Boarding School in Dehradun</title>
    <meta name="description" content="CBSE-affiliated co-ed boarding and day school in Dehradun, Uttarakhand for boys and girls from Class 4 to 12." />
    <meta property="og:title" content="Tulas International School, Dehradun" />
    <meta property="og:image" content="https://tis.edu.in/images/tis-campus-og.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      // Set theme before first paint to avoid a light/dark flash.
      try {
        var saved = localStorage.getItem('tis-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
